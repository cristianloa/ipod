<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPod Classic Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #111;
            height: 100dvh; /* Altura dinámica perfecta para móviles */
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ipod {
            background: linear-gradient(145deg, #f5f5f7, #d1d1d6);
            width: 100%;
            height: 100%;
            max-width: 420px; /* En escritorio se ve como iPod, en móvil ocupa todo */
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
        }

        /* En escritorio, le damos bordes redondeados y sombra */
        @media (min-width: 450px) {
            .ipod {
                height: 95vh;
                border-radius: 40px;
                box-shadow: 0 25px 80px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.8);
                padding: 25px 20px;
            }
        }

        .screen {
            flex: 1; /* Ocupa todo el espacio disponible */
            background: #121212; /* Fondo oscuro para que el embed de Spotify se vea nativo */
            border: 3px solid #333;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(180deg, #4a90e2 0%, #357abd 100%);
            color: white;
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .battery {
            width: 22px;
            height: 11px;
            border: 1.5px solid white;
            border-radius: 3px;
            padding: 1px;
            position: relative;
        }
        .battery::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 2px;
            width: 2px;
            height: 5px;
            background: white;
            border-radius: 0 1px 1px 0;
        }
        .battery-level {
            height: 100%;
            background: #4cd964;
            width: 85%;
            border-radius: 1px;
        }

        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .menu {
            height: 100%;
            overflow-y: auto;
            padding: 10px;
        }

        .menu-item {
            padding: 14px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            color: #e0e0e0;
            background: #1e1e1e;
        }

        .menu-item.selected {
            background: linear-gradient(180deg, #4a90e2 0%, #357abd 100%);
            color: white;
        }

        .embed-container {
            width: 100%;
            height: 100%;
            background: #121212;
        }

        .embed-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .add-form {
            padding: 10px;
            background: #1e1e1e;
            border-top: 1px solid #333;
        }

        .add-form input {
            width: 100%;
            padding: 10px;
            border: 1px solid #4a90e2;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 8px;
            background: #2c2c2c;
            color: white;
        }

        .add-form button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* RUEDA TÁCTIL ESCALABLE */
        .click-wheel {
            background: linear-gradient(145deg, #e8e8e8, #c5c5c5);
            border-radius: 50%;
            width: 65vw; /* Escala con el ancho de la pantalla del móvil */
            max-width: 260px; /* Tope para escritorio */
            aspect-ratio: 1 / 1; /* Mantiene la forma circular perfecta */
            margin: 0 auto 30px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.8);
            touch-action: none;
        }

        .wheel-button {
            position: absolute;
            background: linear-gradient(145deg, #f5f5f7, #d1d1d6);
            border-radius: 50%;
            width: 35%;
            height: 35%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2), inset 0 1px 3px rgba(255,255,255,0.9);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #4a90e2;
            transition: transform 0.1s;
        }

        .wheel-button:active {
            transform: translate(-50%, -50%) scale(0.92);
        }

        .wheel-label {
            position: absolute;
            color: #666;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .wheel-label.top { top: 12%; left: 50%; transform: translateX(-50%); }
        .wheel-label.bottom { bottom: 12%; left: 50%; transform: translateX(-50%); }
        .wheel-label.left { left: 12%; top: 50%; transform: translateY(-50%); }
        .wheel-label.right { right: 12%; top: 50%; transform: translateY(-50%); }

    </style>
</head>
<body>
    <div class="ipod">
        <div class="screen">
            <div class="header">
                <span id="screen-title">Reproduciendo</span>
                <div class="battery"><div class="battery-level"></div></div>
            </div>
            
            <div class="content-area">
                <!-- Contenedor del reproductor de Spotify (VISIBLE POR DEFECTO) -->
                <div class="embed-container" id="embed-container">
                    <!-- theme=0 activa el modo oscuro para que se vea perfecto y el botón de play sea visible -->
                    <iframe id="spotify-embed" src="https://open.spotify.com/embed/playlist/4Tzp3MN0B0oovvJLrJhnUl?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>

                <!-- Menú oculto inicialmente -->
                <div class="menu" id="menu" style="display:none;"></div>
                
                <!-- Formulario para agregar más -->
                <div class="add-form" id="add-form" style="display:none;">
                    <input type="text" id="url-input" placeholder="Pega URL de Spotify (playlist, álbum, canción)...">
                    <button onclick="addFromUrl()">➕ Agregar a la biblioteca</button>
                </div>
            </div>
        </div>

        <div class="click-wheel" id="click-wheel">
            <div class="wheel-label top">MENU</div>
            <div class="wheel-label bottom">PLAY</div>
            <div class="wheel-label left">◀◀</div>
            <div class="wheel-label right">▶▶</div>
            <div class="wheel-button" id="center-button">●</div>
        </div>
    </div>

    <script>
        let items = [
            { title: 'Mi Playlist Principal', url: 'https://open.spotify.com/embed/playlist/4Tzp3MN0B0oovvJLrJhnUl?utm_source=generator&theme=0' }
        ];
        
        let selectedIndex = 0;
        let currentView = 'embed'; // Empezamos directamente en la música

        function convertToEmbed(url) {
            url = url.trim();
            if (url.includes('/embed/')) return url + '&theme=0';
            return url.replace('open.spotify.com/', 'open.spotify.com/embed/') + '?utm_source=generator&theme=0';
        }

        function addFromUrl() {
            const input = document.getElementById('url-input');
            const url = input.value.trim();
            
            if (!url || !url.includes('spotify.com')) {
                alert('Pega una URL válida de Spotify');
                return;
            }
            
            const embedUrl = convertToEmbed(url);
            items.push({ title: `Agregado ${items.length}`, url: embedUrl });
            input.value = '';
            renderMenu();
        }

        function renderMenu() {
            currentView = 'menu';
            document.getElementById('embed-container').style.display = 'none';
            document.getElementById('add-form').style.display = 'block';
            const menu = document.getElementById('menu');
            menu.style.display = 'block';
            document.getElementById('screen-title').textContent = `Biblioteca (${items.length})`;
            
            menu.innerHTML = items.map((item, i) => `
                <div class="menu-item ${i === selectedIndex ? 'selected' : ''}" data-index="${i}">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:75%;">${item.title}</span>
                    <span>▶</span>
                </div>
            `).join('');
            
            menu.querySelectorAll('.menu-item').forEach((item, i) => {
                item.onclick = () => {
                    selectedIndex = i;
                    playItem(i);
                };
            });
        }

        function playItem(index) {
            const item = items[index];
            currentView = 'embed';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('add-form').style.display = 'none';
            const container = document.getElementById('embed-container');
            container.style.display = 'block';
            document.getElementById('screen-title').textContent = 'Reproduciendo';
            
            // Recargar el iframe con la nueva URL
            document.getElementById('spotify-embed').src = item.url;
        }

        function goBack() {
            if (currentView === 'embed') {
                renderMenu();
            } else if (currentView === 'menu') {
                // En menú, el botón de arriba (MENU) podría limpiar o ir al inicio
                currentView = 'embed';
                document.getElementById('menu').style.display = 'none';
                document.getElementById('add-form').style.display = 'none';
                document.getElementById('embed-container').style.display = 'block';
                document.getElementById('screen-title').textContent = 'Reproduciendo';
            }
        }

        function nextItem() {
            if (items.length === 0) return;
            selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
            if (currentView === 'menu') renderMenu();
            else playItem(selectedIndex);
        }

        function prevItem() {
            if (items.length === 0) return;
            selectedIndex = Math.max(selectedIndex - 1, 0);
            if (currentView === 'menu') renderMenu();
            else playItem(selectedIndex);
        }

        // ===== CONTROLES DE LA RUEDA (Táctil y Mouse) =====
        const wheel = document.getElementById('click-wheel');
        let lastAngle = null, accumulated = 0;
        
        const getAngle = (e, el) => {
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(y - cy, x - cx) * 180 / Math.PI;
        };

        const handleMove = (e) => {
            const angle = getAngle(e, wheel);
            if (lastAngle !== null) {
                let delta = angle - lastAngle;
                if (delta > 180) delta -= 360;
                if (delta < -180) delta += 360;
                accumulated += delta;
                
                // Sensibilidad ajustada para móvil
                if (Math.abs(accumulated) > 15) {
                    if (accumulated > 0) nextItem();
                    else prevItem();
                    accumulated = 0;
                }
            }
            lastAngle = angle;
        };

        wheel.addEventListener('mousemove', (e) => { if (e.buttons === 1) handleMove(e); });
        wheel.addEventListener('mouseup', () => { lastAngle = null; accumulated = 0; });
        wheel.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        wheel.addEventListener('touchend', () => { lastAngle = null; accumulated = 0; });

        document.getElementById('center-button').onclick = () => {
            if (currentView === 'menu' && items.length > 0) playItem(selectedIndex);
        };

        // Click en zonas de la rueda
        wheel.addEventListener('click', (e) => {
            if (e.target.id === 'center-button') return;
            const rect = wheel.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cx = rect.width / 2, cy = rect.height / 2;
            const angle = Math.atan2(y - cy, x - cx) * 180 / Math.PI;
            
            if (angle >= -45 && angle < 45) nextItem();       // Derecha
            else if (angle >= 45 && angle < 135) goBack();    // Abajo (PLAY)
            else if (angle >= -135 && angle < -45) prevItem();// Izquierda
            else if (angle >= 135 || angle < -135) goBack();  // Arriba (MENU)
        });

        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addFromUrl();
        });
    </script>
</body>
</html>
