<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPod Radio Classic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #111;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ipod {
            background: linear-gradient(145deg, #f5f5f7, #d1d1d6);
            width: 100%;
            height: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
        }

        @media (min-width: 450px) {
            .ipod {
                height: 95vh;
                border-radius: 40px;
                box-shadow: 0 25px 80px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.8);
                padding: 25px 20px;
            }
        }

        .screen {
            flex: 1;
            background: #000;
            border: 3px solid #333;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            color: white;
        }

        .header {
            background: linear-gradient(180deg, #4a90e2 0%, #357abd 100%);
            color: white;
            padding: 10px 12px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .battery {
            width: 22px; height: 11px; border: 1.5px solid white; border-radius: 3px; padding: 1px; position: relative;
        }
        .battery::after {
            content: ''; position: absolute; right: -4px; top: 2px; width: 2px; height: 5px; background: white; border-radius: 0 1px 1px 0;
        }
        .battery-level { height: 100%; background: #4cd964; width: 85%; border-radius: 1px; }

        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- VISTA: MENÚ --- */
        .menu {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            background: #f0f0f0;
            color: #333;
        }
        .menu-item {
            padding: 14px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .menu-item.selected {
            background: linear-gradient(180deg, #4a90e2 0%, #357abd 100%);
            color: white;
        }
        .menu-item .playing-icon { font-size: 12px; }

        /* --- VISTA: REPRODUCTOR --- */
        .player-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            padding: 20px;
            text-align: center;
        }

        .live-badge {
            background: #e74c3c;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }
        .live-dot {
            width: 8px; height: 8px; background: white; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .station-name-large {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
            color: #fff;
        }

        .status-text {
            font-size: 14px;
            color: #4cd964;
            margin-top: 10px;
            min-height: 20px;
        }

        /* Ecualizador animado simple */
        .equalizer {
            display: flex;
            gap: 4px;
            height: 40px;
            align-items: flex-end;
            margin-top: 30px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .equalizer.active { opacity: 1; }
        .bar {
            width: 6px;
            background: #4a90e2;
            border-radius: 3px;
            animation: bounce 0.8s infinite ease-in-out alternate;
        }
        .bar:nth-child(1) { height: 20%; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 60%; animation-delay: 0.3s; }
        .bar:nth-child(3) { height: 40%; animation-delay: 0.0s; }
        .bar:nth-child(4) { height: 80%; animation-delay: 0.4s; }
        .bar:nth-child(5) { height: 30%; animation-delay: 0.2s; }
        @keyframes bounce { 0% { height: 20%; } 100% { height: 100%; } }

        /* --- RUEDA TÁCTIL --- */
        .click-wheel {
            background: linear-gradient(145deg, #e8e8e8, #c5c5c5);
            border-radius: 50%;
            width: 65vw;
            max-width: 260px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 30px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.8);
            touch-action: none;
            flex-shrink: 0;
        }

        .wheel-button {
            position: absolute;
            background: linear-gradient(145deg, #f5f5f7, #d1d1d6);
            border-radius: 50%;
            width: 35%;
            height: 35%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2), inset 0 1px 3px rgba(255,255,255,0.9);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #4a90e2;
            transition: transform 0.1s;
        }
        .wheel-button:active { transform: translate(-50%, -50%) scale(0.92); }

        .wheel-label {
            position: absolute; color: #666; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
        }
        .wheel-label.top { top: 12%; left: 50%; transform: translateX(-50%); }
        .wheel-label.bottom { bottom: 12%; left: 50%; transform: translateX(-50%); }
        .wheel-label.left { left: 12%; top: 50%; transform: translateY(-50%); }
        .wheel-label.right { right: 12%; top: 50%; transform: translateY(-50%); }

    </style>
</head>
<body>
    <div class="ipod">
        <div class="screen">
            <div class="header">
                <span id="screen-title">Radio</span>
                <div class="battery"><div class="battery-level"></div></div>
            </div>
            
            <div class="content-area">
                <!-- Vista del Menú -->
                <div class="menu" id="menu-view">
                    <!-- Se llena con JS -->
                </div>

                <!-- Vista del Reproductor -->
                <div class="player-view" id="player-view" style="display: none;">
                    <div class="live-badge">
                        <div class="live-dot"></div> EN VIVO
                    </div>
                    <div class="station-name-large" id="player-station-name">Estación</div>
                    <div class="status-text" id="player-status">Conectando...</div>
                    
                    <div class="equalizer" id="equalizer">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div>
                    </div>
                </div>
            </div.
        </div>

        <div class="click-wheel" id="click-wheel">
            <div class="wheel-label top">MENU</div>
            <div class="wheel-label bottom">PLAY/PAUSE</div>
            <div class="wheel-label left">◀◀</div>
            <div class="wheel-label right">▶▶</div>
            <div class="wheel-button" id="center-button">●</div>
        </div>
    </div>

    <!-- Elemento de audio invisible -->
    <audio id="radio-audio" preload="none"></audio>

    <script>
        // 📻 TU LISTA DE ESTACIONES
        const stationsList = [
            { name: 'LOFI 24/7', url: 'https://ec3.yesstreaming.net:3755/stream' },
            { name: 'RADIO OXÍGENO', url: 'https://mdstrm.com/audio/5fab0687bcd6c2389ee9480c/icecast.audio' },
            { name: 'RADIO MÁGICA', url: 'https://mdstrm.com/audio/6839e28eb3fdc597ac2e2e43/icecast.audio?property=aiir&_=224873' },
            { name: 'RADIO FIT', url: 'https://node-15.zeno.fm/fb9sp98vc5zuv' },
            { name: 'RADIO FELICIDAD', url: 'https://mdstrm.com/audio/5fad731fcf097a068af3c8f7/icecast.audio' },
            { name: 'RADIO RPP', url: 'https://mdstrm.com/audio/5fab3416b5f9ef165cfab6e9/icecast.audio' },
            { name: 'RADIO EXITOSA', url: 'https://stream.zeno.fm/csy4vzackf9uv' },
            { name: 'LA INOLVIDABLE', url: 'https://27263.live.streamtheworld.com/CRP_LI_SC?csegid=30008&dist=30008' },
            { name: 'PANAMERICANA', url: 'https://mdstrm.com/audio/6598b62dded1380470f4e539/icecast.audio' },
            { name: 'RITMO ROMÁNTICA', url: 'https://23113.live.streamtheworld.com/CRP_RIT_SC?csegid=30008&dist=30008' },
            { name: 'RADIO CORAZÓN', url: 'https://mdstrm.com/audio/5fada514fc16c006bd63370f/icecast.audio' },
            { name: 'Z ROCK & POP', url: 'https://radioz.egostreaming.pe/radio/3e4f6a1b2c3d4e567890abcd/' },
            { name: 'STUDIO 92', url: 'https://gcdn.2mdn.net/videoplayback/id/0751c120d4c7c8a1/itag/345/source/web_video_ads/xpc/EgVovf3BOg%3D%3D/ctier/L/acao/yes/ip/0.0.0.0/ipbits/0/expire/1752812287/sparams/ip,ipbits,expire,id,itag,source,xpc,ctier,acao/signature/36B65E93093AE4B3E88C9C65B223187B837A084D.3E4DFCA2EC3288AF4DF879EDD389CCBEBE88331C/key/ck2/file/file.mp4' },
            { name: 'RADIO DISNEY', url: 'https://26643.live.streamtheworld.com/DISNEY_PER_LM_SC?dist=web-radiodisney-disneylatino' },
            { name: 'RADIO OASIS', url: 'https://stream.zeno.fm/3bhmjhlsl0wvv' },
            { name: 'LAS QUENAS', url: 'https://radio.lnx.pe:7000/stream' },
            { name: 'SALKANTAY', url: 'http://167.114.118.119:7662/stream' }, // ⚠️ Nota: HTTP mixto puede bloquearse en sitios HTTPS
            { name: 'MEGA STEREO', url: 'https://cast1.my-control-panel.com/proxy/megaestereo/stream' },
            { name: 'COCA RAYMI', url: 'https://stream.zeno.fm/di4yvkfirz0vv' },
            { name: 'ROCK EN ESPAÑOL', url: 'https://stream.zeno.fm/0vgy8qv3feruv' }
        ];

        let currentIndex = 0;
        let currentView = 'menu'; // 'menu' o 'player'
        let isPlaying = false;

        const audio = document.getElementById('radio-audio');
        const menuView = document.getElementById('menu-view');
        const playerView = document.getElementById('player-view');
        const screenTitle = document.getElementById('screen-title');
        const playerStationName = document.getElementById('player-station-name');
        const playerStatus = document.getElementById('player-status');
        const equalizer = document.getElementById('equalizer');

        // --- FUNCIONES DE AUDIO ---
        function loadAndPlay(index) {
            currentIndex = index;
            const station = stationsList[currentIndex];
            
            playerStationName.textContent = station.name;
            playerStatus.textContent = "Conectando...";
            playerStatus.style.color = "#f39c12";
            equalizer.classList.remove('active');
            
            audio.src = station.url;
            audio.load();
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    playerStatus.textContent = "Reproduciendo";
                    playerStatus.style.color = "#4cd964";
                    equalizer.classList.add('active');
                    renderMenu(); // Actualizar icono en el menú
                }).catch(error => {
                    console.error("Error al reproducir:", error);
                    isPlaying = false;
                    playerStatus.textContent = "Error de conexión";
                    playerStatus.style.color = "#e74c3c";
                    equalizer.classList.remove('active');
                });
            }
        }

        function togglePlay() {
            if (currentView === 'menu') {
                loadAndPlay(currentIndex);
                showPlayer();
            } else {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    playerStatus.textContent = "Pausado";
                    playerStatus.style.color = "#f39c12";
                    equalizer.classList.remove('active');
                } else {
                    playerStatus.textContent = "Reconectando...";
                    audio.play().then(() => {
                        isPlaying = true;
                        playerStatus.textContent = "Reproduciendo";
                        playerStatus.style.color = "#4cd964";
                        equalizer.classList.add('active');
                    }).catch(() => {
                        playerStatus.textContent = "Error";
                        playerStatus.style.color = "#e74c3c";
                    });
                }
            }
        }

        function nextStation() {
            currentIndex = (currentIndex + 1) % stationsList.length;
            if (currentView === 'menu') {
                renderMenu();
                scrollToSelected();
            } else {
                loadAndPlay(currentIndex);
            }
        }

        function prevStation() {
            currentIndex = (currentIndex - 1 + stationsList.length) % stationsList.length;
            if (currentView === 'menu') {
                renderMenu();
                scrollToSelected();
            } else {
                loadAndPlay(currentIndex);
            }
        }

        // --- FUNCIONES DE UI ---
        function showPlayer() {
            currentView = 'player';
            menuView.style.display = 'none';
            playerView.style.display = 'flex';
            screenTitle.textContent = 'Reproduciendo';
        }

        function showMenu() {
            currentView = 'menu';
            playerView.style.display = 'none';
            menuView.style.display = 'block';
            screenTitle.textContent = 'Estaciones';
            renderMenu();
            scrollToSelected();
        }

        function renderMenu() {
            menuView.innerHTML = stationsList.map((station, i) => `
                <div class="menu-item ${i === currentIndex ? 'selected' : ''}" data-index="${i}">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:85%;">${station.name}</span>
                    ${i === currentIndex && isPlaying ? '<span class="playing-icon">🔊</span>' : ''}
                </div>
            `).join('');

            menuView.querySelectorAll('.menu-item').forEach((item, i) => {
                item.onclick = () => {
                    currentIndex = i;
                    loadAndPlay(currentIndex);
                    showPlayer();
                };
            });
        }

        function scrollToSelected() {
            setTimeout(() => {
                const selected = menuView.querySelector('.selected');
                if (selected) {
                    selected.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 50);
        }

        // Inicializar menú
        renderMenu();

        // --- CONTROLES DE LA RUEDA ---
        const wheel = document.getElementById('click-wheel');
        let lastAngle = null, accumulated = 0;
        
        const getAngle = (e, el) => {
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(y - cy, x - cx) * 180 / Math.PI;
        };

        const handleMove = (e) => {
            const angle = getAngle(e, wheel);
            if (lastAngle !== null) {
                let delta = angle - lastAngle;
                if (delta > 180) delta -= 360;
                if (delta < -180) delta += 360;
                accumulated += delta;
                
                if (Math.abs(accumulated) > 15) { // Sensibilidad
                    if (accumulated > 0) nextStation();
                    else prevStation();
                    accumulated = 0;
                }
            }
            lastAngle = angle;
        };

        wheel.addEventListener('mousemove', (e) => { if (e.buttons === 1) handleMove(e); });
        wheel.addEventListener('mouseup', () => { lastAngle = null; accumulated = 0; });
        wheel.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        wheel.addEventListener('touchend', () => { lastAngle = null; accumulated = 0; });

        // Botón central
        document.getElementById('center-button').onclick = () => {
            if (currentView === 'menu') {
                loadAndPlay(currentIndex);
                showPlayer();
            } else {
                togglePlay();
            }
        };

        // Zonas de la rueda (Click)
        wheel.addEventListener('click', (e) => {
            if (e.target.id === 'center-button') return;
            const rect = wheel.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cx = rect.width / 2, cy = rect.height / 2;
            const angle = Math.atan2(y - cy, x - cx) * 180 / Math.PI;
            
            if (angle >= -45 && angle < 45) nextStation();       // Derecha (▶▶)
            else if (angle >= 45 && angle < 135) togglePlay();   // Abajo (PLAY)
            else if (angle >= -135 && angle < -45) prevStation();// Izquierda (◀◀)
            else if (angle >= 135 || angle < -135) showMenu();   // Arriba (MENU)
        });

    </script>
</body>
</html>
